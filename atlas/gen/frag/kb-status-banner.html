<!-- SHIPPED (features.md §5.10 / Keyboard/KeyboardStatusRow.swift): a dictation outcome as a slim tinted status row INSIDE the Recents card, between the header and the entries. Never an overlay. -->
<!-- spacer pushes the keyboard strip to the bottom -->
<div style="height:300px"></div>

<!-- faux host text field -->
<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
  <span style="width:48px;height:48px;border-radius:50%;background:var(--jot-card-top);border:0.5px solid var(--jot-card-border);display:flex;align-items:center;justify-content:center">
    <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:var(--jot-ink);stroke-width:2"><path d="M12 5v14M5 12h14"/></svg>
  </span>
  <div style="flex:1;display:flex;align-items:center;gap:8px;height:48px;background:var(--jot-card-top);border:0.5px solid var(--jot-card-border);border-radius:24px;padding:0 16px">
    <span style="width:2px;height:20px;background:var(--jot-accent)"></span>
    <span style="flex:1;color:var(--jot-ink-cap);font-size:16px">Text Message · SMS</span>
    <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--jot-ink-cap)"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11z"/></svg>
  </div>
</div>

<!-- keyboard strip -->
<div style="background:var(--jot-card-bot);border-radius:24px 24px 0 0;padding:14px 12px 18px;margin:0 -6px">

  <!-- RECENT list card — status row inside the card -->
  <div class="jot-card" style="margin:0 0 14px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px">
      <span class="jot-section" style="margin:0">Recent</span>
      <span style="color:var(--jot-accent);font-size:14px;font-weight:600">See all ›</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:4px 10px 6px;padding:8px 12px;border-radius:10px;background:rgba(255,159,48,0.14);color:#B87314;font-size:13px;font-weight:600">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;flex:none"><circle cx="12" cy="12" r="10" fill="#B87314"/><path d="M12 7v6M12 16.5v.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Cleanup didn’t run — pasted as spoken</span>
    </div>
    <div class="jot-row" style="padding:10px 14px">
      <span class="jot-row-sub" style="font-variant-numeric:tabular-nums;letter-spacing:0.3px;color:var(--jot-ink-cap);flex:none;width:58px">2:07 PM</span>
      <span class="grow" style="color:var(--jot-accent);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Not that it vanishes on its own, the UX…</span>
      <span style="width:32px;height:24px;display:flex;align-items:center;justify-content:center;flex:none">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:var(--jot-accent);stroke-width:1.9;stroke-linecap:round"><path d="M4 20l10-10M13 5l1.2 2.6L17 8.8l-2.8 1.2L13 12.6l-1.2-2.6L9 8.8l2.8-1.2zM19 3l.6 1.4L21 5l-1.4.6L19 7l-.6-1.4L17 5l1.4-.6z"/></svg>
      </span>
    </div>
    <div class="jot-row" style="padding:10px 14px">
      <span class="jot-row-sub" style="font-variant-numeric:tabular-nums;letter-spacing:0.3px;color:var(--jot-ink-cap);flex:none;width:58px">2:04 PM</span>
      <span class="grow" style="color:var(--jot-accent);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">One salad had gone bad, the other was…</span>
      <span style="width:32px;height:24px;display:flex;align-items:center;justify-content:center;flex:none">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:var(--jot-accent);stroke-width:1.9;stroke-linecap:round"><path d="M4 20l10-10M13 5l1.2 2.6L17 8.8l-2.8 1.2L13 12.6l-1.2-2.6L9 8.8l2.8-1.2zM19 3l.6 1.4L21 5l-1.4.6L19 7l-.6-1.4L17 5l1.4-.6z"/></svg>
      </span>
    </div>
    <div class="jot-row" style="padding:10px 14px">
      <span class="jot-row-sub" style="font-variant-numeric:tabular-nums;letter-spacing:0.3px;color:var(--jot-ink-cap);flex:none;width:58px">2:04 PM</span>
      <span class="grow" style="color:var(--jot-accent);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Well, if I’m making food for you, it does…</span>
      <span style="width:32px;height:24px;display:flex;align-items:center;justify-content:center;flex:none">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:var(--jot-accent);stroke-width:1.9;stroke-linecap:round"><path d="M4 20l10-10M13 5l1.2 2.6L17 8.8l-2.8 1.2L13 12.6l-1.2-2.6L9 8.8l2.8-1.2zM19 3l.6 1.4L21 5l-1.4.6L19 7l-.6-1.4L17 5l1.4-.6z"/></svg>
      </span>
    </div>
  </div>

  <!-- control row: ••• / Jot down pill / return / backspace -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <span style="width:56px;height:54px;border-radius:11px;background:var(--jot-card-top);border:0.5px solid var(--jot-card-border);display:flex;align-items:center;justify-content:center;flex:none">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:var(--jot-ink)"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>
    </span>
    <div style="flex:1;height:54px;border-radius:13px;background:linear-gradient(var(--jot-accent),var(--jot-accent-deep));display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 18px rgba(26,140,255,0.35)">
      <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#fff"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11z"/></svg>
      <span style="color:#fff;font-size:18px;font-weight:600">Jot down</span>
    </div>
    <span style="width:72px;height:54px;border-radius:11px;background:rgba(120,120,128,0.28);display:flex;align-items:center;justify-content:center;flex:none">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:var(--jot-ink);stroke-width:2"><path d="M20 7v4a3 3 0 01-3 3H6m0 0l4-4m-4 4l4 4"/></svg>
    </span>
    <span style="width:60px;height:54px;border-radius:11px;background:rgba(120,120,128,0.34);display:flex;align-items:center;justify-content:center;flex:none">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:var(--jot-ink);stroke-width:1.8"><path d="M21 6H9L3 12l6 6h12a1 1 0 001-1V7a1 1 0 00-1-1z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>
    </span>
  </div>

  <!-- bottom system row: globe / mic -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0">
    <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:none;stroke:var(--jot-ink);stroke-width:1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:var(--jot-ink)"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11z"/></svg>
  </div>

</div>
