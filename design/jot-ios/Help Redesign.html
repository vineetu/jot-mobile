<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jot · Help redesign</title>
<link rel="stylesheet" href="tokens/fonts.css">
<link rel="stylesheet" href="tokens/colors.css">
<link rel="stylesheet" href="tokens/typography.css">
<link rel="stylesheet" href="tokens/production.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  html, body { margin: 0; padding: 0; }

  /* ---------- screen scaffold ---------- */
  .hs {
    width: 393px;
    min-height: 100%;
    box-sizing: border-box;
    background: var(--bg-screen);
    background-color: var(--bg-deep);
    color: var(--ink);
    font-family: var(--font-sys);
    padding: 0 18px 30px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .hs * { box-sizing: border-box; }

  .hs-status {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 0;
    font-size: 16px;
    font-weight: 600;
  }
  .hs-status .sglyphs { display: flex; align-items: center; gap: 6px; color: var(--ink); }

  .hs-back {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--chrome-fill);
    border: 1px solid rgba(26,140,255,0.35);
    display: flex; align-items: center; justify-content: center;
    margin: 14px 0 26px;
    color: #9CC8FF;
  }
  [data-theme="light"] .hs-back { color: var(--jot-blue-flat); }

  .hs-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 42px;
    letter-spacing: var(--track-title);
    line-height: 1.05;
    margin: 0 0 10px;
  }
  .hs-subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 19px;
    color: var(--ink-italic);
    margin: 0 0 30px;
  }

  .hs-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--ink-caption);
    margin: 0 0 12px;
    padding-left: 2px;
  }
  .hs-gap { height: 28px; }

  /* ---------- icon tiles ---------- */
  .tile {
    flex: none;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .tile.t34 { width: 34px; height: 34px; }
  .tile.t30 { width: 30px; height: 30px; border-radius: 8px; }
  .tile.t44 { width: 44px; height: 44px; border-radius: 11px; }
  .tile.speak { background: linear-gradient(180deg, var(--icon-speech-top), var(--icon-speech-bottom)); }
  .tile.warm  { background: linear-gradient(180deg, var(--icon-micready-top), var(--icon-micready-bottom)); }
  .tile.ai    { background: linear-gradient(180deg, var(--icon-ai-top), var(--icon-ai-bottom)); }
  .tile.ask   { background: var(--jot-accent-grad); }
  .tile.priv  { background: linear-gradient(180deg, var(--icon-privacy-top), var(--icon-privacy-bottom)); }
  .tile.fb    { background: linear-gradient(180deg, var(--icon-feedback-top), var(--icon-feedback-bottom)); }

  /* ---------- cards (shared) ---------- */
  .hcard {
    background: var(--card);
    border: 1px solid var(--card-bord);
    border-radius: 18px;
  }

  /* ---------- variant A · compact feature cards ---------- */
  .feat-stack { display: flex; flex-direction: column; gap: 12px; }
  .feat-card {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 15px 16px;
  }
  .feat-card .tile { margin-top: 2px; }
  .feat-card h3 {
    margin: 0 0 4px;
    font-size: 16.5px; font-weight: 600;
    letter-spacing: -0.2px;
  }
  .feat-card p {
    margin: 0;
    font-size: 14.5px; line-height: 1.4;
    color: var(--ink-sub);
    text-wrap: pretty;
  }

  /* ---------- variant B · expandable rows ---------- */
  .exp-card { overflow: hidden; }
  .exp-row {
    display: flex; align-items: center; gap: 14px;
    padding: 16px;
  }
  .exp-row + .exp-row, .exp-open + .exp-row { border-top: 1px solid var(--hairline); }
  .exp-row h3 {
    margin: 0; flex: 1;
    font-size: 16.5px; font-weight: 600; letter-spacing: -0.2px;
  }
  .exp-chev { color: var(--glyph-soft); flex: none; }
  .exp-open { border-top: 1px solid var(--hairline); }
  .exp-open .exp-row { border-top: none; }
  .exp-open p {
    margin: -6px 0 0;
    padding: 0 16px 16px 64px;
    font-size: 14.5px; line-height: 1.45;
    color: var(--ink-sub);
    text-wrap: pretty;
  }
  .exp-hint {
    margin: 10px 2px 0;
    font-size: 12.5px;
    color: var(--ink-caption);
  }

  /* ---------- variant C · swipeable carousel ---------- */
  .caro-strip {
    display: flex; gap: 12px;
    margin-right: -18px;          /* bleed to screen edge */
    overflow: hidden;
  }
  .caro-card {
    flex: none;
    width: 296px;
    padding: 20px 18px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .caro-card h3 {
    margin: 0;
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
    line-height: 1.25;
  }
  .caro-card p {
    margin: 0;
    font-size: 14.5px; line-height: 1.45;
    color: var(--ink-sub);
    text-wrap: pretty;
  }
  .caro-dots {
    display: flex; gap: 7px; justify-content: center;
    margin-top: 16px;
  }
  .caro-dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dot-todo);
  }
  .caro-dots i.on { background: var(--jot-blue-flat); }

  /* ---------- getting started steps ---------- */
  .steps { padding: 6px 16px; }
  .step-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0;
  }
  .step-row + .step-row { border-top: 1px solid var(--hairline); }
  .step-num {
    flex: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--jot-blue-soft);
    border: 1px solid var(--jot-blue-border);
    color: var(--jot-blue-flat);
    font-size: 13.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step-row span { font-size: 15.5px; color: var(--ink); }

  /* ---------- troubleshooting ---------- */
  .qa { padding: 2px 16px; }
  .qa-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0;
  }
  .qa-row + .qa-row { border-top: 1px solid var(--hairline); }
  .qa-row .qa-q { flex: 1; font-size: 15.5px; font-weight: 500; }
  .qa-row .exp-chev { color: var(--glyph-soft); }

  /* ---------- privacy + feedback ---------- */
  /* ---------- privacy row (Help) + feedback ---------- */
  .pv-row {
    display: flex; gap: 14px; align-items: center;
    padding: 14px 16px;
  }
  .pv-row .pv-t { flex: 1; }
  .pv-row h4 { margin: 0 0 2px; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
  .pv-row p { margin: 0; font-size: 13px; color: var(--ink-caption); }

  /* ---------- privacy proof page ---------- */
  .ppr-lead {
    margin: 0 0 22px;
    font-size: 15.5px; line-height: 1.5;
    color: var(--ink-sub);
    text-wrap: pretty;
  }
  .ppr-lead b { color: var(--ink); font-weight: 600; }
  .ppr-card { padding: 16px; }
  .ppr-row { padding: 12px 0; }
  .ppr-row + .ppr-row { border-top: 1px solid var(--hairline); }
  .ppr-row code {
    display: block;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 14px; font-weight: 500;
    color: var(--ink);
  }
  .ppr-bar { display: flex; align-items: center; gap: 8px; margin: 8px 0 6px; }
  .ppr-bar i {
    display: block; height: 4px; border-radius: 2px;
    background: var(--jot-blue-flat);
  }
  .ppr-bar b { font-size: 13px; font-weight: 500; color: var(--ink-sub); }
  .ppr-row span { display: block; font-size: 13px; color: var(--ink-caption); }
  .ppr-note {
    margin: 12px 2px 0;
    font-size: 12.5px; line-height: 1.45;
    color: var(--ink-caption);
    text-wrap: pretty;
  }
  .ppr-cta {
    margin-top: 26px;
    height: 54px; border-radius: 27px;
    background: var(--jot-accent-grad);
    box-shadow: 0 10px 30px var(--jot-glow);
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: 18px; font-weight: 600; color: #fff;
  }
  .ppr-foot {
    margin: 14px 10px 0;
    font-size: 12.5px; line-height: 1.45;
    text-align: center;
    color: var(--ink-caption);
    text-wrap: pretty;
  }

  .fb-card {
    display: flex; gap: 14px; align-items: center;
    padding: 14px 16px;
  }
  .fb-card .fb-t { flex: 1; font-size: 16px; font-weight: 600; }

  .hs-rail {
    width: 140px; height: 5px; border-radius: 3px;
    background: var(--rail);
    margin: 26px auto 0;
  }

  /* ---------- wizard W4 "How it works" scene — 5.2s loop ---------- */
  .hs {
    --how-phone-bg: #0C1422;
    --how-phone-bord: rgba(255,255,255,0.12);
    --how-bubble: rgba(255,255,255,0.10);
    --how-barink: rgba(255,255,255,0.5);
    --how-kb-hairline: rgba(255,255,255,0.06);
    --how-rail: rgba(255,255,255,0.55);
  }
  [data-theme="light"] .hs {
    --how-phone-bg: #EAEFF7;
    --how-phone-bord: rgba(20,30,50,0.10);
    --how-bubble: rgba(40,60,96,0.10);
    --how-barink: rgba(40,52,74,0.45);
    --how-kb-hairline: rgba(0,0,0,0.06);
    --how-rail: rgba(20,30,50,0.4);
  }
  .how-wrap { display: flex; justify-content: center; margin: 8px 0 28px; }
  .how-recdot { animation: howrec 5.2s ease-in-out infinite; }
  @keyframes howrec { 0%,12% { opacity: 0.25; } 22%,100% { opacity: 1; } 50%,70% { opacity: 0.4; } }
  .how-kb { animation: howkb 5.2s cubic-bezier(.5,0,.2,1) infinite; }
  @keyframes howkb { 0%,30% { transform: translateY(0); } 46%,86% { transform: translateY(100%); } 100% { transform: translateY(0); } }
  .how-app { animation: howapp 5.2s cubic-bezier(.5,0,.2,1) infinite; }
  @keyframes howapp { 0%,30% { transform: translateY(28%); opacity: .35; } 46%,100% { transform: translateY(0); opacity: 1; } }
  .how-typed { animation: howtyped 5.2s ease-in-out infinite; }
  @keyframes howtyped { 0%,60% { opacity: 0; transform: translateY(6px) scale(.96); } 72%,90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .how-dictate { animation: howdict 5.2s ease-in-out infinite; }
  @keyframes howdict { 0%,18% { transform: scale(1); } 24% { transform: scale(.9); } 30% { transform: scale(1); } }
  .how-swipe { animation: howswipe 5.2s ease-in-out infinite; }
  @keyframes howswipe {
    0%,30% { opacity: 0; transform: translateX(118px); }
    38% { opacity: 1; }
    46% { opacity: 1; transform: translateX(14px); }
    56% { opacity: 0; transform: translateX(14px); }
    100% { opacity: 0; transform: translateX(14px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .how-recdot, .how-kb, .how-app, .how-typed, .how-dictate, .how-swipe { animation: none; }
    .how-app { transform: none; opacity: 1; }
    .how-typed { opacity: 1; }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0A1422">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="470" y="170" width="260" height="120" rx="26" fill="#1A8CFF"/>
    <path d="M600 198c8 40 23 55 63 78-40 23-55 38-63 78-8-40-23-55-63-78 40-23 55-38 63-78z" fill="#fff"/>
    <rect x="430" y="360" width="340" height="34" rx="17" fill="#ffffff" opacity="0.85"/>
    <rect x="430" y="430" width="240" height="26" rx="13" fill="#ffffff" opacity="0.4"/>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel">
const { createElement: h } = React;

/* ================= glyphs ================= */
const GL = {
  chevBack: (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  ),
  chevDown: (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  ),
  chevUp: (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  ),
  chevRight: (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  ),
  keyboard: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"><rect x="3" y="6.5" width="18" height="11" rx="2.2"/><path d="M6.4 10h.01M9.8 10h.01M13.2 10h.01M16.6 10h.01M6.4 13h.01M16.6 13h.01M9 14.2h6" strokeWidth="2.1"/></svg>
  ),
  warmhold: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v4h-4"/><path d="M12 8.4v4l2.6 1.6"/></svg>
  ),
  wand: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"><path d="M5 19L16 8"/><path d="M17.5 3.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z" fill="#fff" strokeWidth="1.1"/><path d="M8.5 4.8v2.4M7.3 6h2.4" strokeWidth="1.7"/></svg>
  ),
  spark: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="#fff"><path d="M12 2.6c.9 4.8 2.7 6.6 7.4 9.4-4.7 2.8-6.5 4.6-7.4 9.4-.9-4.8-2.7-6.6-7.4-9.4 4.7-2.8 6.5-4.6 7.4-9.4z"/></svg>
  ),
  shield: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l7 2.6v5.2c0 4.6-3 8.1-7 9.6-4-1.5-7-5-7-9.6V5.6L12 3z"/><path d="M9.2 12l2 2 3.6-3.8"/></svg>
  ),
  bubble: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4.5l1.8-2.7A8 8 0 1 1 21 12z"/></svg>
  ),
  book: (sz) => (
    <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 6.5C10.5 5 8.5 4.4 5 4.4V18c3.5 0 5.5.6 7 2 1.5-1.4 3.5-2 7-2V4.4c-3.5 0-5.5.6-7 2.1z"/><path d="M12 6.5V20"/></svg>
  ),
  signal: (
    <svg width="56" height="14" viewBox="0 0 56 14" fill="none"><rect x="0" y="6" width="3" height="7" rx="1" fill="currentColor"/><rect x="5" y="4" width="3" height="9" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="11" rx="1" fill="currentColor" opacity=".4"/><path d="M24 5.4a8.5 8.5 0 0 1 9 0M25.8 8.2a5.4 5.4 0 0 1 5.4 0M27.7 10.8a2.2 2.2 0 0 1 1.7 0" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"/><rect x="40" y="2.4" width="14" height="9.4" rx="3" fill="currentColor"/><rect x="55" y="5.4" width="1.6" height="3.6" rx=".8" fill="currentColor" opacity=".5"/></svg>
  ),
};

/* ================= content ================= */
const FEATURES = [
  { key: "speak", tileCls: "speak", glyph: GL.keyboard,
    title: "Speak instead of typing, in any app",
    short: "Switch to the Jot keyboard, tap Jot down, talk. Your words land in the field you're in." },
  { key: "warm", tileCls: "warm", glyph: GL.warmhold,
    title: "Keep going when life interrupts",
    short: "Calls, app switches — the mic stays warm for five minutes, and what you said is already saved." },
  { key: "polish", tileCls: "ai", glyph: GL.wand,
    title: "Polish what you said into what you meant",
    short: "Tap the wand: Cleanup, Action Items, Email — or a prompt you wrote. All on this iPhone." },
  { key: "ask", tileCls: "ask", glyph: GL.spark,
    title: "Find your ideas by asking Jot",
    short: "Ask in plain words — \u201cwhat did I decide about the launch?\u201d — and get an answer from your own notes." },
];

const STEPS = [
  "Tap Jot down on your keyboard",
  "Jot opens and starts recording",
  "Swipe back to your app",
  "Stop from the keyboard when you\u2019re done",
];

const QAS = [
  "The keyboard didn\u2019t paste",
  "My recording was cut off",
  "The speech model didn\u2019t download",
  "It heard the wrong words",
];

/* ================= shared chrome ================= */
function HSHeader() {
  return (
    <div>
      <div className="hs-status"><span>2:01</span><span className="sglyphs">{GL.signal}</span></div>
      <div className="hs-back">{GL.chevBack}</div>
      <h1 className="hs-title">Help</h1>
      <p className="hs-subtitle">Everything you need to know about Jot</p>
    </div>
  );
}

function HSFooter() {
  return (
    <div>
      <div className="hs-gap"></div>
      <div className="hs-label">Getting started</div>
      <div className="hcard pv-row">
        <div className="tile t34" style={{background: "linear-gradient(180deg, var(--icon-help-top), var(--icon-help-bottom))"}}>{GL.book(19)}</div>
        <div className="pv-t">
          <h4>How Jot works</h4>
          <p>The 30-second refresher, animated</p>
        </div>
        <span className="exp-chev">{GL.chevRight}</span>
      </div>

      <div className="hs-gap"></div>
      <div className="hs-label">Troubleshooting</div>
      <div className="hcard qa">
        {QAS.map((q, i) => (
          <div className="qa-row" key={i}>
            <span className="qa-q">{q}</span>
            <span className="exp-chev">{GL.chevDown}</span>
          </div>
        ))}
      </div>

      <div className="hs-gap"></div>
      <div className="hs-label">Privacy</div>
      <div className="hcard pv-row">
        <div className="tile t34 priv">{GL.shield(19)}</div>
        <div className="pv-t">
          <h4>Everything happens on your iPhone</h4>
          <p>See the proof in your App Privacy Report</p>
        </div>
        <span className="exp-chev">{GL.chevRight}</span>
      </div>

      <div className="hs-gap"></div>
      <div className="hcard fb-card">
        <div className="tile t34 fb">{GL.bubble(18)}</div>
        <span className="fb-t">Send feedback</span>
        <span className="exp-chev">{GL.chevRight}</span>
      </div>

      <div className="hs-rail"></div>
    </div>
  );
}

/* ================= variant A · compact cards ================= */
function HelpCards() {
  return (
    <div className="hs">
      <HSHeader />
      <div className="hs-label">What Jot does</div>
      <div className="feat-stack">
        {FEATURES.map((f) => (
          <div className="hcard feat-card" key={f.key}>
            <div className={"tile t34 " + f.tileCls}>{f.glyph(19)}</div>
            <div>
              <h3>{f.title}</h3>
              <p>{f.short}</p>
            </div>
          </div>
        ))}
      </div>
      <HSFooter />
    </div>
  );
}

/* ================= variant B · expandable rows ================= */
function HelpExpand() {
  return (
    <div className="hs">
      <HSHeader />
      <div className="hs-label">What Jot does</div>
      <div className="hcard exp-card">
        <div className="exp-row">
          <div className="tile t34 speak">{GL.keyboard(19)}</div>
          <h3>{FEATURES[0].title}</h3>
          <span className="exp-chev">{GL.chevDown}</span>
        </div>
        <div className="exp-open">
          <div className="exp-row">
            <div className="tile t34 warm">{GL.warmhold(19)}</div>
            <h3>{FEATURES[1].title}</h3>
            <span className="exp-chev">{GL.chevUp}</span>
          </div>
          <p>{FEATURES[1].short + " Even if a call drops everything, the part you\u2019d already dictated is safe in the text field."}</p>
        </div>
        <div className="exp-row">
          <div className="tile t34 ai">{GL.wand(19)}</div>
          <h3>{FEATURES[2].title}</h3>
          <span className="exp-chev">{GL.chevDown}</span>
        </div>
        <div className="exp-row">

        <div style={{ height: 11, width: "70%", borderRadius: 6, background: "var(--how-barink)", opacity: 0.4 }}></div>

          <div className="how-dictate" style={{ flex: 1, height: 34, borderRadius: 17, background: grad, display: "flex", alignItems: "center", justifyContent: "center" }}>

function GettingStartedPage() {
  return (

/* ================= privacy proof page ================= */
function PrivacyPage() {
  return (
    <div className="hs">
      <div className="hs-status"><span>2:01</span><span className="sglyphs">{GL.signal}</span></div>

/* ================= canvas ================= */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
  }, [t.theme]);
  return (
    <DesignCanvas>
      <DCSection id="help" title="Help — final direction (B · tap to expand)" subtitle="Feature showcase up top (incl. Ask), tap to expand · Getting started & Privacy push their own pages">
        <DCArtboard id="b-expand" label="Help" width={393} height={1380}>
          <HelpExpand />
        </DCArtboard>
        <DCArtboard id="gs-page" label="Getting started · pushed from the Help row" width={393} height={890}>
          <GettingStartedPage />
        </DCArtboard>
        <DCArtboard id="privacy-page" label="Privacy · pushed from the Help row" width={393} height={855}>
          <PrivacyPage />
        </DCArtboard>
      </DCSection>
      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={t.theme} options={["dark", "light"]} onChange={(v) => setTweak("theme", v)} />
      </TweaksPanel>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
