<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05070c; overflow: hidden; }
  #root { height: 100%; }
  @keyframes askPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.82); } }
  @keyframes askCaret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes askShimmer { 0% { background-position: -220px 0; } 100% { background-position: 220px 0; } }
  @keyframes askRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes askFade { from { opacity: 0; } to { opacity: 1; } }
  /* reactive waveform bars */
  @keyframes wv1 { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @keyframes wv2 { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(0.85); } }
  @keyframes wv3 { 0%,100% { transform: scaleY(0.7); } 50% { transform: scaleY(0.28); } }
  .ask-scroll::-webkit-scrollbar { width: 0; height: 0; }
</style>
