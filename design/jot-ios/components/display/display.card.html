<!-- @dsCard group="Components" viewport="700x380" subtitle="GlassCard · ProgressDots · Waveform · StopPill · CitationChip · SourceRow" name="Display" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../card-runtime.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); }
  .col { padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .lbl { font-size: 10.5px; color: var(--ink-caption); }
  .ans { font-size: 15px; line-height: 1.56; color: var(--ink); letter-spacing: -0.1px; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
(async () => {
  const C = await loadJotComponents([
    "components/brand/JotGlyph.jsx",
    "components/display/GlassCard.jsx",
    "components/display/ProgressDots.jsx",
    "components/display/Waveform.jsx",
    "components/display/StopPill.jsx",
    "components/display/CitationChip.jsx",
    "components/display/SourceRow.jsx",
  ]);
  const { JotGlyph, GlassCard, ProgressDots, Waveform, StopPill, CitationChip, SourceRow } = C;
  ReactDOM.createRoot(document.getElementById("root")).render(
    <div className="col">
      <div className="row">
        <ProgressDots total={7} current={2} /><span className="lbl">ProgressDots</span>
        <Waveform bars={7} height={22} /><span className="lbl">Waveform</span>
        <StopPill time="0:08" /><span className="lbl">StopPill</span>
      </div>
      <GlassCard radius={18} padding={16}>
        <p className="ans">Decided to ship the keyboard update in June <CitationChip label="May 29" /> and keep the warm-hold default on <CitationChip label="Jun 2" />.</p>
      </GlassCard>
      <GlassCard radius={18} padding="4px 14px">
        <SourceRow date="May 29" snippet="Decided to ship the keyboard update in June — pricing TBD…" />
        <SourceRow date="Jun 2" snippet="Warm-hold stays default-on; revisit after beta feedback…" />
      </GlassCard>
    </div>
  );
})();
</script>
</body>
</html>
