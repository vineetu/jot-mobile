<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../card-runtime.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); }
  .col { padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .lbl { font-size: 10.5px; color: var(--ink-caption); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
(async () => {
  const C = await loadJotComponents([
    "components/brand/JotGlyph.jsx",
    "components/actions/CtaPill.jsx",
    "components/actions/GlassButton.jsx",
    "components/actions/GlassPill.jsx",
    "components/actions/TextLink.jsx",
    "components/actions/IosToggle.jsx",
  ]);
  const { JotGlyph, CtaPill, GlassButton, GlassPill, TextLink, IosToggle } = C;
  function Demo() {
    const [on, setOn] = React.useState(true);
    return (
      <div className="col">
        <div className="row">
          <div style={{ flex: 1 }}><CtaPill>Get started</CtaPill></div>
          <div style={{ flex: 1 }}><CtaPill disabled>Continue</CtaPill></div>
        </div>
        <div className="row">
          <GlassButton size={46}><JotGlyph name="chevron-left" /></GlassButton>
          <GlassButton size={46}><JotGlyph name="close" size={16} /></GlassButton>
          <GlassButton size={56}><JotGlyph name="pause" /></GlassButton>
          <GlassButton size={56}><JotGlyph name="trash" color="var(--jot-red)" /></GlassButton>
          <GlassPill>Done</GlassPill>
          <GlassPill height={34} accent>Ask another</GlassPill>
          <span className="lbl">glass chrome</span>
        </div>
        <div className="row">
          <IosToggle on={on} onChange={setOn} />
          <span className="lbl">IosToggle</span>
          <TextLink><JotGlyph name="keyboard-mini" size={18} /> Type instead</TextLink>
          <TextLink>I've already added it</TextLink>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
})();
</script>
</body>
</html>
