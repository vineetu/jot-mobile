<!-- @dsCard group="Colors" viewport="700x170" subtitle="Never flat — layered radial glow over navy / cool grey" name="Screen backgrounds" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); display: flex; gap: 10px; padding: 14px; background: #fff; box-sizing: border-box; }
  .panel { flex: 1; height: 142px; border-radius: 16px; position: relative; overflow: hidden; border: 0.5px solid rgba(20,30,50,0.12); }
  .panel small { position: absolute; left: 13px; bottom: 11px; font-size: 11.5px; font-weight: 600; }
</style>
</head>
<body>
  <div class="panel" style="background:
    radial-gradient(128% 72% at 50% -8%, rgba(64,116,196,0.50) 0%, rgba(40,74,128,0.16) 36%, rgba(18,30,52,0) 60%),
    radial-gradient(120% 84% at 88% 112%, rgba(120,72,56,0.20) 0%, rgba(120,72,56,0) 52%),
    linear-gradient(177deg, #1b2c4f 0%, #15233c 32%, #0e1827 72%, #0a1019 100%);">
    <small style="color: rgba(233,238,247,0.8);">dark · var(--bg-screen)</small>
  </div>
  <div class="panel" style="background:
    radial-gradient(128% 74% at 50% -8%, rgba(150,184,232,0.62) 0%, rgba(150,184,232,0.12) 40%, rgba(150,184,232,0) 62%),
    radial-gradient(120% 84% at 88% 112%, rgba(222,170,150,0.24) 0%, rgba(222,170,150,0) 52%),
    linear-gradient(177deg, #E9EEF7 0%, #DEE4EE 44%, #D0D6E0 100%);">
    <small style="color: rgba(54,62,78,0.8);">light · [data-theme=light]</small>
  </div>
</body>
</html>
