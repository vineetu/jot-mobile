<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Hit targets and chrome sizes (iPhone logical px)" name="Control sizes" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); display: flex; align-items: center; gap: 14px; padding: 18px; box-sizing: border-box; }
  .c { background: var(--chrome-fill); border: 0.5px solid var(--chrome-bord); border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--ink-sub); font-size: 11px; flex-shrink: 0; }
  .lbl { color: var(--ink-caption); font-size: 10.5px; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
  <div><div class="c" style="width: 42px; height: 42px;">42</div><div class="lbl">back</div></div>
  <div><div class="c" style="width: 46px; height: 46px;">46</div><div class="lbl">chrome</div></div>
  <div><div class="c" style="width: 56px; height: 56px;">56</div><div class="lbl">transport</div></div>
  <div><div class="c" style="width: 60px; height: 60px;">60</div><div class="lbl">send</div></div>
  <div><div class="c" style="width: 120px; height: 38px;">38h</div><div class="lbl">glass pill</div></div>
  <div style="flex: 1;"><div class="c" style="width: 100%; height: 62px; background: var(--jot-blue-grad); border: none; color: #fff; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-cta);">CTA 62h</div><div class="lbl">primary pill · full width</div></div>
</body>
</html>
