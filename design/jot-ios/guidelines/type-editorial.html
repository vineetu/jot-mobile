<!-- @dsCard group="Type" viewport="700x230" subtitle="Fraunces italic — the spoken/editorial voice" name="Editorial type" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); padding: 18px 22px; box-sizing: border-box; }
  .spec { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
  .spec em { font-family: var(--font-serif); font-style: italic; font-weight: 500; color: var(--ink); letter-spacing: -0.5px; line-height: 1.1; white-space: nowrap; }
  .spec small { font-size: 10.5px; color: var(--ink-caption); white-space: nowrap; }
</style>
</head>
<body>
  <div class="spec"><em style="font-size: 41px;">Welcome to Jot.</em><small>41 · welcome title</small></div>
  <div class="spec"><em style="font-size: 30px;">Keep talking — Jot's still listening.</em><small>30 · titles / hero transcript</small></div>
  <div class="spec"><em style="font-size: 22px;">What did I decide about the launch?</em><small>22 · question header</small></div>
  <div class="spec"><em style="font-size: 17px; color: var(--ink-caption);">“Summarize what I recorded today”</em><small>17 · spoken suggestions</small></div>
</body>
</html>
