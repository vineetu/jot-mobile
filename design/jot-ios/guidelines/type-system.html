<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); padding: 18px 22px; box-sizing: border-box; }
  .spec { display: flex; align-items: baseline; gap: 16px; margin-bottom: 11px; }
  .spec b, .spec span.t { color: var(--ink); white-space: nowrap; }
  .spec small { font-size: 10.5px; color: var(--ink-caption); white-space: nowrap; }
</style>
</head>
<body>
  <div class="spec"><b style="font-size: 18.5px; font-weight: 600; letter-spacing: -0.2px;">Get started</b><small>18.5/600 · CTA label</small></div>
  <div class="spec"><span class="t" style="font-size: 17.5px; line-height: 1.42; color: var(--ink-sub);">Jot needs the mic to transcribe. Audio is processed on your iPhone.</span><small>17.5/400 · body</small></div>
  <div class="spec"><b style="font-size: 16.5px; font-weight: 500;">Done</b><small>16.5/500 · glass pill</small></div>
  <div class="spec"><span class="t" style="font-size: 15.5px; font-weight: 600;">Listening</span><small>15.5/600 · status</small></div>
  <div class="spec"><span class="t" style="font-size: 12.5px; color: var(--ink-caption);">We'd skip this step if we could.</span><small>12.5 · footnote</small></div>
  <div class="spec">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-caption);">Sources</span>
    <span style="font-size: 9.5px; font-weight: 700; letter-spacing: 2px; color: var(--jot-blue-flat);">BETA</span>
    <small>11 + 9.5/700 · caps labels</small>
  </div>
</body>
</html>
