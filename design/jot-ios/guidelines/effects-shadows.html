<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Blue glows for floats; glass blur; signature easing" name="Shadows & effects" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); display: flex; align-items: center; gap: 22px; padding: 24px; box-sizing: border-box; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
  .lbl { color: var(--ink-caption); font-size: 10.5px; text-align: center; }
</style>
</head>
<body>
  <div class="item">
    <div style="width: 120px; height: 48px; border-radius: 24px; background: var(--jot-blue-grad); box-shadow: var(--shadow-cta);"></div>
    <div class="lbl">--shadow-cta<br>glow + inset highlight</div>
  </div>
  <div class="item">
    <div style="width: 56px; height: 56px; border-radius: 28px; background: var(--jot-blue-grad); box-shadow: var(--shadow-send);"></div>
    <div class="lbl">--shadow-send</div>
  </div>
  <div class="item">
    <div style="width: 120px; height: 48px; border-radius: 16px; background: var(--chrome-fill); border: 0.5px solid var(--chrome-bord); backdrop-filter: var(--blur-chrome);"></div>
    <div class="lbl">glass · blur(16px)<br>0.5px hairline</div>
  </div>
  <div class="item">
    <div style="width: 92px; height: 78px; border-radius: 20px; background: linear-gradient(180deg, #1b2c4f, #13203a); box-shadow: var(--shadow-card-float); border: 0.5px solid var(--card-bord);"></div>
    <div class="lbl">--shadow-card-float<br>floating cards only</div>
  </div>
  <div class="item">
    <div style="width: 110px; height: 48px; border-radius: 12px; background: var(--card); border: 0.5px solid var(--card-bord); display: flex; align-items: center; justify-content: center; color: var(--ink-sub); font-size: 10px;">cubic-bezier(.45,.02,.2,1)</div>
    <div class="lbl">--ease-jot · signature ease</div>
  </div>
</body>
</html>
