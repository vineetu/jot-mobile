<!-- @dsCard group="Colors" viewport="700x190" subtitle="Same tokens scoped [data-theme=light]" name="Light theme" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px; }
  .tk { border-radius: 12px; padding: 9px 10px; background: var(--card); border: 0.5px solid var(--card-bord); }
  .chip { width: 100%; height: 26px; border-radius: 7px; margin-bottom: 7px; border: 0.5px solid rgba(20,30,50,0.12); box-sizing: border-box; }
  .tk b { display: block; font-size: 11px; font-weight: 600; color: var(--ink); }
  .tk span { font-size: 10px; color: var(--ink-caption); }
</style>
</head>
<body data-theme="light">
  <div class="grid">
    <div class="tk"><div class="chip" style="background: var(--ink);"></div><b>--ink</b><span>#16181D</span></div>
    <div class="tk"><div class="chip" style="background: var(--ink-sub);"></div><b>--ink-sub</b><span>70% slate</span></div>
    <div class="tk"><div class="chip" style="background: var(--ink-caption);"></div><b>--ink-caption</b><span>48%</span></div>
    <div class="tk"><div class="chip" style="background: var(--chrome-fill);"></div><b>--chrome-fill</b><span>glass 72% white</span></div>
    <div class="tk"><div class="chip" style="background: var(--chrome-bord);"></div><b>--chrome-bord</b><span>hairline 8%</span></div>
    <div class="tk"><div class="chip" style="background: var(--card);"></div><b>--card</b><span>78% white</span></div>
    <div class="tk"><div class="chip" style="background: var(--card-bord);"></div><b>--card-bord</b><span>7%</span></div>
    <div class="tk"><div class="chip" style="background: var(--field-fill);"></div><b>--field-fill</b><span>60% white</span></div>
    <div class="tk"><div class="chip" style="background: var(--rail);"></div><b>--rail</b><span>home bar 26%</span></div>
    <div class="tk"><div class="chip" style="background: var(--hairline);"></div><b>--hairline</b><span>dividers 8%</span></div>
  </div>
</body>
</html>
