<!-- @dsCard group="Spacing" viewport="700x190" subtitle="0.5px hairlines everywhere; radii from chip 7 to sheet 40" name="Radii" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); background: var(--bg-screen); display: flex; align-items: flex-end; gap: 12px; padding: 18px; box-sizing: border-box; }
  .r { background: var(--card); border: 0.5px solid var(--card-bord); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px; color: var(--ink-sub); font-size: 10.5px; text-align: center; }
</style>
</head>
<body>
  <div class="r" style="width: 76px; height: 60px; border-radius: 7px;">chip 7</div>
  <div class="r" style="width: 76px; height: 64px; border-radius: 9px;">tile 9</div>
  <div class="r" style="width: 84px; height: 72px; border-radius: 13px;">field 13</div>
  <div class="r" style="width: 96px; height: 86px; border-radius: 18px;">card 18</div>
  <div class="r" style="width: 104px; height: 100px; border-radius: 28px;">card-lg 28</div>
  <div class="r" style="width: 120px; height: 62px; border-radius: 31px;">pill 31</div>
  <div class="r" style="width: 110px; height: 120px; border-radius: 40px 40px 0 0;">sheet 40</div>
</body>
</html>
