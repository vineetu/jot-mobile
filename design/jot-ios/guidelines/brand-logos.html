<!-- @dsCard group="Brand" viewport="700x200" subtitle="Locked j + waveform mark — white / gradient / mono + wordmarks" name="Logo lockups" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sys); display: flex; gap: 10px; padding: 14px; background: #fff; box-sizing: border-box; }
  .cell { flex: 1; height: 152px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative; }
  .cell img { height: 76px; }
  .cell small { position: absolute; bottom: 9px; font-size: 10.5px; }
  .dark-bg { background: linear-gradient(177deg, #1b2c4f, #0e1827); }
  .light-bg { background: #F2F5FA; border: 0.5px solid rgba(20,30,50,0.10); }
  .blue-bg { background: var(--jot-icon-grad); }
</style>
</head>
<body>
  <div class="cell light-bg"><img src="../assets/logo/jot-mark-gradient.svg" alt="gradient mark"><small style="color: rgba(54,62,78,0.6);">gradient · on light</small></div>
  <div class="cell dark-bg"><img src="../assets/logo/jot-mark-white.svg" alt="white mark"><small style="color: rgba(233,238,247,0.6);">white · on dark</small></div>
  <div class="cell blue-bg"><img src="../assets/logo/jot-mark-white.svg" alt="white mark on blue"><small style="color: rgba(255,255,255,0.75);">white · on brand blue</small></div>
  <div class="cell light-bg"><img src="../assets/logo/jot-wordmark-gradient.svg" alt="wordmark" style="height: 64px;"><small style="color: rgba(54,62,78,0.6);">wordmark · gradient</small></div>
  <div class="cell dark-bg"><img src="../assets/logo/jot-wordmark-white.svg" alt="white wordmark" style="height: 64px;"><small style="color: rgba(233,238,247,0.6);">wordmark · white</small></div>
</body>
</html>
